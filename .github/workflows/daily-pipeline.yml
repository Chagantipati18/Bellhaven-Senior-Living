name: Daily Bellhaven reconciliation

on:
  schedule:
    # 06:30 Pacific Standard Time (14:30 UTC). During daylight saving time
    # GitHub runs this at 07:30 Pacific because scheduled workflows use UTC.
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bellhaven-daily-pipeline
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Bellhaven_CRM_Review_Project/bellhaven

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore persistent review state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            Bellhaven_CRM_Review_Project/bellhaven/data/review.sqlite3
            Bellhaven_CRM_Review_Project/bellhaven/data/review.sqlite3-shm
            Bellhaven_CRM_Review_Project/bellhaven/data/review.sqlite3-wal
          key: bellhaven-review-state-${{ github.run_id }}
          restore-keys: |
            bellhaven-review-state-

      - name: Run tests
        run: python -m unittest -v test_core.py

      - name: Run read-only reconciliation
        env:
          BELLHAVEN_API_TOKEN: ${{ secrets.BELLHAVEN_API_TOKEN }}
        run: |
          test -n "$BELLHAVEN_API_TOKEN" || { echo "BELLHAVEN_API_TOKEN is not configured"; exit 1; }
          python pipeline.py

      - name: Save persistent review state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            Bellhaven_CRM_Review_Project/bellhaven/data/review.sqlite3
            Bellhaven_CRM_Review_Project/bellhaven/data/review.sqlite3-shm
            Bellhaven_CRM_Review_Project/bellhaven/data/review.sqlite3-wal
          key: bellhaven-review-state-${{ github.run_id }}

      - name: Upload reconciliation results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bellhaven-reconciliation-${{ github.run_number }}
          path: |
            Bellhaven_CRM_Review_Project/bellhaven/data/latest.json
            Bellhaven_CRM_Review_Project/bellhaven/data/locations.csv
            Bellhaven_CRM_Review_Project/bellhaven/data/runs/
          retention-days: 30
          if-no-files-found: error

